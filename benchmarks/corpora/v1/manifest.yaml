    license: MIT
    languages: [ruby]
    content_types: [code, markdown]
    paths: [lib, README.md]
    labels:
      format: yaml
      location: benchmarks/corpora/v1/development-queries.yaml
      selector: dry-configurable
      provenance: authored from the pinned repository before retrieval changes
      public: true
    selection_allowed: true

external_suites:
  - id: popup-maker-pm20
    split: legacy_regression
    selection_allowed: false
    availability: authorized_sources_required
    languages: [php]
    content_types: [code]
    labels:
      location: scripts/benchmark_pm.py
      provenance: historical project-authored PM20 labels
      public: true
    repositories:
      - id: core
        repository_url: https://github.com/PopupMaker/Popup-Maker.git
        revision: c5a0227f4158ac7a70f0cb6bff97719f19092f6b
        license: GPL-2.0-or-later
      - id: pro
        repository_url: private://PopupMaker/Pro
        revision: dfd3f12c2bf08365c11c70addf0da518600a6886
        license: proprietary

  - id: popup-maker-mixed-media
    split: legacy_regression
    selection_allowed: false
    availability: authorized_sources_required
    languages: [php]
    content_types: [code, markdown, mixed]
    labels:
      location: scripts/benchmark_mixed.py
      provenance: historical project-authored mixed-media labels
      public: true
    repositories:
      - id: core
        repository_url: https://github.com/PopupMaker/Popup-Maker.git
        revision: c5a0227f4158ac7a70f0cb6bff97719f19092f6b
        license: GPL-2.0-or-later
      - id: pro
        repository_url: private://PopupMaker/Pro
        revision: dfd3f12c2bf08365c11c70addf0da518600a6886
        license: proprietary
      - id: docs
        repository_url: private://PopupMaker/content
        revision: a4cd10a3f70eedad268f75bdd5c48bbe45b73913
        license: proprietary

sealed_holdout:
  split: sealed_holdout
  manifest_path_env: TESSERA_SEALED_HOLDOUT_MANIFEST
  storage_requirement: private-or-encrypted and inaccessible to implementation agents
  public_labels: false
  selection_allowed: false
  opening_policy: once for a frozen milestone candidate
  rotation_policy: retire the opened corpus into legacy_regression and commission a new sealed corpus
