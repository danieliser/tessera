schema_version: 1
manifest_id: tessera-retrieval-corpora-v1
created_at: 2026-07-14
evaluation_policy:
  primary_aggregation: macro_per_repository
  confidence_interval: paired_repository_bootstrap_95
  legacy_regression_selection_allowed: false
  development_selection_allowed: true
  sealed_holdout_selection_allowed: false

repositories:
  - id: nextjs
    split: legacy_regression
    repository_url: https://github.com/vercel/next.js.git
    revision: adf8c612adddd103647c90ff0f511ea35c57076e
    configured_ref: v16.1.6
    license: MIT
    languages: [typescript, javascript]
    content_types: [code, markdown, mdx]
    paths: [packages/next/src, docs]
    labels:
      format: python
      location: scripts/benchmark_validation/queries_nextjs.py
      provenance: project-authored and verified against the pinned checkout
      public: true
    selection_allowed: false

  - id: flask
    split: legacy_regression
    repository_url: https://github.com/pallets/flask.git
    revision: 2c1b30d0503cfb064f1cb252e6614a06915a362a
    configured_ref: 3.1.2
    license: BSD-3-Clause
    languages: [python]
    content_types: [code, markdown, rst]
    paths: [src/flask, docs]
    labels:
      format: python
      location: scripts/benchmark_validation/queries_flask.py
      provenance: project-authored and verified against the pinned checkout
      public: true
    selection_allowed: false

  - id: attrs
    split: development
    repository_url: https://github.com/python-attrs/attrs.git
    revision: d544dd2dacb4cbd660891e323ad92751ba65b4e0
    license: MIT
    languages: [python]
    content_types: [code, markdown, rst]
    paths: [src, docs, README.md]
    labels:
      format: yaml
      location: benchmarks/corpora/v1/development-queries.yaml
      selector: attrs
      provenance: authored from the pinned repository before retrieval changes
      public: true
    selection_allowed: true

  - id: hono
    split: development
    repository_url: https://github.com/honojs/hono.git
    revision: b2ae3a2204a48ce15a26448fd746d39745eb1837
    license: MIT
    languages: [typescript, javascript]
    content_types: [code, markdown]
    paths: [src, docs, README.md]
    labels:
      format: yaml
      location: benchmarks/corpora/v1/development-queries.yaml
      selector: hono
      provenance: authored from the pinned repository before retrieval changes
      public: true
    selection_allowed: true

  - id: fastroute
    split: development
    repository_url: https://github.com/nikic/FastRoute.git
    revision: 1c961398bef1ff6ecd8b273bef651d7afe90312b
    license: BSD-3-Clause
    languages: [php]
    content_types: [code, markdown]
    paths: [src, README.md]
    labels:
      format: yaml
      location: benchmarks/corpora/v1/development-queries.yaml
