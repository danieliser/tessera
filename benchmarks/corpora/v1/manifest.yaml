    selection_allowed: true

  - id: pflag
    split: development
    repository_url: https://github.com/spf13/pflag.git
    revision: 5fdac2d16c16d60605cb8baa887e8c5c38ef623f
    license: BSD-3-Clause
    languages: [go]
    content_types: [code, markdown]
    paths: ['.']
    labels:
      format: yaml
      location: benchmarks/corpora/v1/development-queries.yaml
